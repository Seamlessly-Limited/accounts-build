<head>
  <!--
    Paints the last-saved theme before the app bundle loads or the body's own CSS-var-driven
    background paints. Without this, every reload (and every fresh tab) briefly shows the
    default :root theme and then snaps to the account's actual theme once main.js runs — visible
    on anything slower than a warm cache. Reads only the token snapshot themes.ts writes on
    commit (`flow-theme-tokens`), never the draft preview a settings visit may have painted, so a
    freshly opened tab always matches the saved theme, not whatever was last previewed.
  -->
  <script>
    (function () {
      try {
        var snapshot = JSON.parse(localStorage.getItem('flow-theme-tokens') || 'null');
        if (!snapshot || !snapshot.tokens) return;
        var root = document.documentElement;
        for (var key in snapshot.tokens) {
          if (Object.prototype.hasOwnProperty.call(snapshot.tokens, key)) {
            root.style.setProperty(key, snapshot.tokens[key]);
          }
        }
        if (snapshot.mode === 'dark') {
          root.classList.add('dark');
        }
      } catch (e) {
        // No cache yet, or it's corrupt — the default :root theme paints instead.
      }
    })();
  </script>

  <!--
    theme-color is the browser's own chrome — the address bar on mobile, the title bar on desktop
    PWAs. It names the app's actual --background token from style.css, not the marketing page's:
    hsl(0 0% 100%) light, hsl(224 71.4% 4.1%) dark. Change one and change the other.
  -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)">

  <!--
    The icon set is the same mark and the same cuts the marketing site ships, so the tab, the
    installed app and seamlessly.online cannot drift apart. The .ico is a real multi-resolution
    16/32/48 icon: the previous one declared 256x256 entries whose PNG payloads were 2000px, which
    Chrome rejects outright and falls back to the default globe for.
  -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">

    Nunito Sans is the one type family the interface is set in. It is requested as a variable font
    across ital/opsz/wght so every weight the UI asks for is a real cut rather than a synthesised
    one, and so small text gets its optical size — two files instead of eight.

    Playfair Display, Merriweather and Roboto are here for the document editor's font picker only:
    a user styling a *document* may choose them, the same way Word offers Times New Roman. They are
    never applied to chrome. Inter is gone — nothing offers it any more.
  -->
